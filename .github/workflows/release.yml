name: Build and release

on:
  push:
    tags:
      - "ARMA3-MCC5*"
    branches:
      - "claude/great-cannon-anljb6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # On a branch push, only release when the commit message contains [release]
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PBO
        run: python3 tools/build_pbo.py build

      - name: Zip mod folder
        run: |
          cd build
          zip -r ../ARMA3-MCC5.zip @mcc_sandbox_a3

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ARMA3-MCC5
          target_commitish: ${{ github.sha }}
          name: ARMA3-MCC5
          files: ARMA3-MCC5.zip
          body: |
            ![MCC 5](https://raw.githubusercontent.com/haganahzion/Arma3-MCC5/${{ github.sha }}/docs/mcc5_banner.png)

            MCC Sandbox 5 for Arma 3.

            **Install:** download `ARMA3-MCC5.zip`, unzip it, move the `@mcc_sandbox_a3` folder into your Arma 3 folder,
            then in the Arma 3 Launcher go to Mods > Local mod and pick `@mcc_sandbox_a3`. Requires **CBA_A3**.
            Untick any old MCC version. Full steps: INSTALL.md inside the zip.

            **What's new:** the old MCC menu is replaced by Zeus and Eden modules; GAIA AI rewritten for performance,
            with smart vehicle use, AI support calls (artillery, CAS, reinforcements) and coordinated attacks;
            bigger Mission Wizard missions and multi-AO campaigns; ACE3/RHS/CUP auto-detected; LAMBS and HBQ
            Advanced Driving AI compatible; optional limited logistics; security fixes. See MCC_changelog.txt (R34, R35).

            This build has not been tested in game yet. Please report problems with your RPT log.
